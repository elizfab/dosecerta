version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME:-dose-certa-backend}-api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=${DB_NAME:-dose-certa-backend}
      - SERVER_PORT=8080
      - APP_ENV=${APP_ENV:-development}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dose-certa-backend-net

  mongo:
    image: mongo:7.0
    container_name: ${PROJECT_NAME:-dose-certa-backend}-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_DATABASE=${DB_NAME:-dose-certa-backend}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dose-certa-backend-net

  mongo-express:
    image: mongo-express:1.0.2
    container_name: ${PROJECT_NAME:-dose-certa-backend}-mongo-express
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-changeme123}
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dose-certa-backend-net

volumes:
  mongo-data:
    name: ${PROJECT_NAME:-dose-certa-backend}-mongo-data
    driver: local

networks:
  dose-certa-backend-net:
    name: ${PROJECT_NAME:-dose-certa-backend}-net
    driver: bridge
