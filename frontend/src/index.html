<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>DoseCerta &amp; Saúde</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Controle de medicações, doses, horários, medidas e exames — simples e acolhedor."
    />
    <meta name="theme-color" content="#fdf3f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="logo.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.45.0/dist/tabler-icons.min.css"
    />
    <script>
      // Aplica o tema salvo antes da renderização (evita "flash" no dark mode).
      (function () {
        try {
          var t = localStorage.getItem('dc-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
